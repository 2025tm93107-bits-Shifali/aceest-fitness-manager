apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-live
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-fitness
      mode: live
  template:
    metadata:
      labels:
        app: aceest-fitness
        mode: live
    spec:
      containers:
        - name: aceest-fitness
          image: shifali23/aceest-fitness:v1.0
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "v1.0"
            - name: DEPLOYMENT_VARIANT
              value: "live-production"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-shadow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-fitness
      mode: shadow
  template:
    metadata:
      labels:
        app: aceest-fitness
        mode: shadow
    spec:
      containers:
        - name: aceest-fitness
          image: shifali23/aceest-fitness:v2.0
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "v2.0"
            - name: DEPLOYMENT_VARIANT
              value: "shadow-mirror"
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-live-svc
spec:
  type: NodePort
  selector:
    app: aceest-fitness
    mode: live
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30084
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-shadow-svc
spec:
  type: ClusterIP
  selector:
    app: aceest-fitness
    mode: shadow
  ports:
    - port: 80
      targetPort: 5000
