apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-fitness
      slot: blue
  template:
    metadata:
      labels:
        app: aceest-fitness
        slot: blue
    spec:
      containers:
        - name: aceest-fitness
          image: shifali23/aceest-fitness:v1.0
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "v1.0"
            - name: DEPLOYMENT_VARIANT
              value: "blue"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-fitness
      slot: green
  template:
    metadata:
      labels:
        app: aceest-fitness
        slot: green
    spec:
      containers:
        - name: aceest-fitness
          image: shifali23/aceest-fitness:v2.0
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "v2.0"
            - name: DEPLOYMENT_VARIANT
              value: "green"
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-bg-svc
spec:
  type: NodePort
  selector:
    app: aceest-fitness
    slot: blue
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30082
