apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-stable
spec:
  replicas: 4
  selector:
    matchLabels:
      app: aceest-fitness
      track: stable
  template:
    metadata:
      labels:
        app: aceest-fitness
        track: stable
        traffic-pool: canary-pool
    spec:
      containers:
        - name: aceest-fitness
          image: shifali23/aceest-fitness:v1.0
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "v1.0"
            - name: DEPLOYMENT_VARIANT
              value: "stable"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-fitness
      track: canary
  template:
    metadata:
      labels:
        app: aceest-fitness
        track: canary
        traffic-pool: canary-pool
    spec:
      containers:
        - name: aceest-fitness
          image: shifali23/aceest-fitness:v2.0
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "v2.0"
            - name: DEPLOYMENT_VARIANT
              value: "canary"
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-canary-svc
spec:
  type: NodePort
  selector:
    traffic-pool: canary-pool
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30083
