apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-variant-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-fitness
      experiment: ab
      variant: a
  template:
    metadata:
      labels:
        app: aceest-fitness
        experiment: ab
        variant: a
    spec:
      containers:
        - name: aceest-fitness
          image: shifali23/aceest-fitness:v1.0
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "v1.0"
            - name: DEPLOYMENT_VARIANT
              value: "variant-A"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-variant-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-fitness
      experiment: ab
      variant: b
  template:
    metadata:
      labels:
        app: aceest-fitness
        experiment: ab
        variant: b
    spec:
      containers:
        - name: aceest-fitness
          image: shifali23/aceest-fitness:v2.0
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "v2.0"
            - name: DEPLOYMENT_VARIANT
              value: "variant-B"
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-variant-a-svc
spec:
  type: NodePort
  selector:
    variant: a
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30085
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-fitness-variant-b-svc
spec:
  type: NodePort
  selector:
    variant: b
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30086
